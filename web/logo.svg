<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <!-- TAKO TANK. The wordmark is chunky cream block letters with an orange edge, the O a ring with a wave in it; the octopus perched on top is
       the game's own kind: a tall mottled mantle, eyes out on the sides with wide dark slit pupils, arms draped over the letters. Each square is a voxel. -->
  <defs>
    <style>
      .w{font:900 112px/1 "Arial Black","Avenir Next Heavy","Helvetica Neue",Arial,sans-serif;fill:#fff1d6;letter-spacing:2px;paint-order:stroke fill;stroke:#f26a2a;stroke-width:12px;stroke-linejoin:round}
      .x{font:900 112px/1 "Arial Black","Avenir Next Heavy","Helvetica Neue",Arial,sans-serif;fill:#d9541e;letter-spacing:2px;paint-order:stroke fill;stroke:#d9541e;stroke-width:12px;stroke-linejoin:round}
    </style>
  </defs>
  <g id="octo" transform="translate(206 -4) scale(9)">
    <!-- mantle: a rounded dome, the game's shape -->
    <g fill="#ee6f44">
      <rect x="5" y="0" width="7" height="1"/><rect x="4" y="1" width="9" height="1"/><rect x="3" y="2" width="11" height="2"/><rect x="2" y="4" width="13" height="7"/><rect x="2" y="11" width="13" height="2"/><rect x="3" y="13" width="11" height="1"/>
    </g>
    <g fill="#f8a06c"><rect x="6" y="1" width="2" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/><rect x="3" y="5" width="2" height="1"/><rect x="12" y="4" width="1" height="2"/><rect x="7" y="6" width="1" height="1"/><rect x="3" y="9" width="1" height="1"/><rect x="12" y="8" width="2" height="1"/><rect x="8" y="9" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/></g>
    <g fill="#c94b25"><rect x="11" y="2" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="9" y="5" width="2" height="1"/><rect x="5" y="8" width="1" height="1"/><rect x="13" y="6" width="1" height="1"/><rect x="10" y="10" width="1" height="1"/><rect x="2" y="12" width="13" height="1"/><rect x="3" y="13" width="11" height="1"/></g>
    <!-- eyes: out on the sides, raised, the wide dark slit pupil -->
    <g fill="#ee6f44"><rect x="1" y="6" width="3" height="4"/><rect x="13" y="6" width="3" height="4"/></g>
    <g fill="#f8e6c8"><rect x="1" y="7" width="3" height="2"/><rect x="13" y="7" width="3" height="2"/></g>
    <g fill="#1a1414"><rect x="1" y="8" width="3" height="1"/><rect x="13" y="8" width="3" height="1"/></g>
    <g fill="#fff" opacity=".9"><rect x="1" y="7" width="1" height="1"/><rect x="15" y="7" width="1" height="1"/></g>
    <!-- arms: six, thick at the root, thinning as they go, draped over the letters and curling out at the tips -->
    <g fill="#ee6f44">
      <rect x="-1" y="13" width="4" height="2"/><rect x="-3" y="14" width="3" height="2"/><rect x="-4" y="16" width="2" height="3"/><rect x="-5" y="19" width="2" height="3"/><rect x="-6" y="22" width="1" height="2"/><rect x="-7" y="24" width="2" height="1"/>
      <rect x="3" y="14" width="2" height="3"/><rect x="2" y="17" width="2" height="3"/><rect x="2" y="20" width="1" height="3"/><rect x="1" y="23" width="1" height="2"/><rect x="2" y="25" width="2" height="1"/>
      <rect x="6" y="14" width="2" height="4"/><rect x="6" y="18" width="1" height="4"/><rect x="5" y="22" width="1" height="2"/><rect x="6" y="24" width="2" height="1"/>
      <rect x="9" y="14" width="2" height="4"/><rect x="10" y="18" width="1" height="4"/><rect x="11" y="22" width="1" height="2"/><rect x="9" y="24" width="2" height="1"/>
      <rect x="12" y="14" width="2" height="3"/><rect x="13" y="17" width="2" height="3"/><rect x="14" y="20" width="1" height="3"/><rect x="15" y="23" width="1" height="2"/><rect x="13" y="25" width="2" height="1"/>
      <rect x="14" y="13" width="4" height="2"/><rect x="17" y="14" width="3" height="2"/><rect x="19" y="16" width="2" height="3"/><rect x="20" y="19" width="2" height="3"/><rect x="22" y="22" width="1" height="2"/><rect x="22" y="24" width="2" height="1"/>
    </g>
    <g fill="#c94b25"><rect x="-1" y="14" width="4" height="1"/><rect x="14" y="14" width="4" height="1"/><rect x="3" y="16" width="2" height="1"/><rect x="12" y="16" width="2" height="1"/><rect x="6" y="17" width="2" height="1"/><rect x="9" y="17" width="2" height="1"/><rect x="-3" y="15" width="3" height="1"/><rect x="17" y="15" width="3" height="1"/></g>
    <g fill="#fbd0b0">
      <rect x="-4" y="17" width="1" height="1"/><rect x="-5" y="20" width="1" height="1"/><rect x="2" y="18" width="1" height="1"/><rect x="2" y="21" width="1" height="1"/><rect x="6" y="19" width="1" height="1"/><rect x="6" y="21" width="1" height="1"/>
      <rect x="10" y="19" width="1" height="1"/><rect x="10" y="21" width="1" height="1"/><rect x="14" y="18" width="1" height="1"/><rect x="14" y="21" width="1" height="1"/><rect x="20" y="17" width="1" height="1"/><rect x="21" y="20" width="1" height="1"/>
    </g>
  </g>
  <g id="word">
    <g class="x"><text x="54" y="262" transform="translate(5 7)">TAK</text><text x="54" y="262" transform="translate(3 4)">TAK</text></g>
    <text class="w" x="54" y="262">TAK</text>
    <g transform="translate(372 215)">
      <circle r="52" fill="#d9541e" transform="translate(5 7)"/>
      <circle r="52" fill="#fff1d6" stroke="#f26a2a" stroke-width="12"/>
      <circle r="24" fill="#f26a2a"/>
      <path d="M-20 6 C-12 -10 -4 -8 2 -2 C-2 -3 -6 0 -6 4 C2 -2 10 -4 18 6 Z" fill="#fff1d6"/><path d="M-16 13 C-10 6 -2 8 2 11 C6 8 12 8 16 12" fill="none" stroke="#fff1d6" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g class="x"><text x="54" y="392" transform="translate(5 7)">TANK</text><text x="54" y="392" transform="translate(3 4)">TANK</text></g>
    <text class="w" x="54" y="392">TANK</text>
  </g>
</svg>
