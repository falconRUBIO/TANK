<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Tank</title>
<script>if (location.pathname.startsWith("/join/")) document.write('<base href="/">')</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/jsm/"}}</script>
<style>
  :root{--bg:#0a1220;--panel:#0f1a2c;--line:#1d2c44;--ink:#dbe8f7;--dim:#7e93ad;--gold:#e6c36a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050a12;color:var(--ink);font:14px -apple-system,system-ui,"SF Pro Text",sans-serif;overflow:hidden}
  #app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
  header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:15px;letter-spacing:.14em;font-weight:600}
  .pill{margin-top:6px;display:inline-flex;gap:6px;align-items:center;font:11px ui-monospace,Menlo,monospace;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#0c1626}
  .avs{display:flex;gap:6px}.av{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);position:relative;background:#16263c}
  .av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:#41d37e;border:2px solid var(--bg)}
  main{flex:1;min-height:0;position:relative;overflow:hidden}
  canvas.av{position:static;width:100%;height:100%;border-radius:7px;image-rendering:pixelated}
  canvas#tank{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block;image-rendering:pixelated}
  .tod{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;gap:4px;padding:4px;background:rgba(8,14,26,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:999px}
  .tod button{all:unset;font:11px ui-monospace,Menlo,monospace;color:var(--dim);padding:6px 10px;border-radius:999px;cursor:pointer}
  .tod button.on{background:rgba(255,255,255,.12);color:var(--ink)}
  nav{display:flex;justify-content:space-around;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);background:var(--panel)}
  nav div{font-size:10px;color:var(--dim);text-align:center;width:60px}nav div.on{color:var(--ink)}
  nav svg{display:block;margin:0 auto 3px;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
  #card{position:absolute;left:12px;right:12px;bottom:12px;padding:14px 16px 14px;background:rgba(10,18,32,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);border-radius:16px;transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  #card.on{transform:none;pointer-events:auto}
  #card h2{margin:0;font-size:20px;letter-spacing:.02em}.sp{color:var(--dim);font-size:12px;margin:1px 0 8px}
  #card .x{all:unset;position:absolute;right:14px;top:10px;font-size:22px;color:var(--dim);cursor:pointer;line-height:1}
  .chips{display:flex;gap:6px;margin-bottom:10px}.chips span{font-size:11px;padding:3px 9px;border-radius:999px;background:#17304f;color:#a9c8ee;border:1px solid #244368}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px;font-size:12.5px}dt{color:var(--dim)}dd{margin:0;text-align:right}
  .needs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.nb{font-size:11px;color:var(--dim)}.nb i{display:block;height:5px;border-radius:3px;background:#17253b;margin-top:3px;overflow:hidden}.nb b{display:block;height:100%;background:linear-gradient(90deg,#3d9be0,#7fd0ff);border-radius:3px}
  .av{overflow:visible}
  canvas#glass{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;pointer-events:none;touch-action:none}
  #toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-8px);opacity:0;transition:.3s;background:rgba(10,18,32,.85);border:1px solid rgba(255,255,255,.1);padding:7px 14px;border-radius:999px;font:12px ui-monospace,Menlo,monospace;color:var(--ink);white-space:nowrap;pointer-events:none;backdrop-filter:blur(8px)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;padding:16px 16px 18px;background:rgba(10,18,32,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  #sheet.on{transform:none}#sheet h3{margin:0 0 12px;font-size:15px;letter-spacing:.06em;text-align:center}
  #sheet .x{all:unset;position:absolute;right:16px;top:12px;font-size:22px;color:var(--dim);cursor:pointer}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:#101f33;font-size:12px;text-align:center}
  .tile span{font-size:26px}.tile:active{border-color:var(--gold)}
  .dim{color:var(--dim);font-size:12px;margin:12px 0 0;text-align:center}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
  .slot small{color:var(--dim);font-size:11px}.slot canvas.big{width:76px;height:76px;border-radius:12px;image-rendering:pixelated;border:1px solid var(--line)}
  .slot.empty span{width:76px;height:76px;border-radius:12px;border:1px dashed #2c4466;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--dim)}
  .jl{display:flex;flex-direction:column;gap:8px}.je{border:1px solid var(--line);background:#101f33;border-radius:10px;padding:10px 12px}.je small{display:block;color:var(--dim);font:10px ui-monospace,Menlo,monospace;letter-spacing:.08em;margin-bottom:3px}
  #conn{display:none;color:#e8b04a}#conn.on{display:inline}
  .av.empty{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:18px;cursor:pointer;background:transparent}.av.ghost{opacity:.3}
  .av i.off{background:#5a6b82}.av{cursor:pointer}
  .code{margin:14px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#101f33;text-align:center}.code small{display:block;color:var(--dim);font:10px ui-monospace,Menlo,monospace;letter-spacing:.12em}
  .code b{display:block;font:600 26px ui-monospace,Menlo,monospace;letter-spacing:.3em;margin:4px 0 8px;color:var(--gold)}.code .row{display:flex;gap:6px;justify-content:center}
  .code button,.send button{all:unset;cursor:pointer;font-size:12px;padding:6px 10px;border-radius:8px;background:#17304f;color:#a9c8ee;border:1px solid #244368}
  #sheet h4{margin:14px 0 6px;font:11px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .act{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid #15243a}.act small{color:var(--dim)}
  .chat{max-height:110px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:12.5px}.msg b{color:#8ec3ff}.msg.me b{color:var(--gold)}
  .send{display:flex;gap:6px;margin-top:8px}.send input{flex:1;background:#0c1626;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
  #welcome{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,10,18,.72);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .35s}
  #welcome.on{opacity:1;pointer-events:auto}
  .scr{width:min(340px,88vw);display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
  .scr h1{margin:4px 0 0;font:700 26px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:.12em}.scr h2{margin:0;font-size:15px;letter-spacing:.16em}
  .scr p{margin:0;color:var(--dim)}.logo{font-size:44px}
  .big{all:unset;box-sizing:border-box;cursor:pointer;padding:14px;border-radius:12px;background:linear-gradient(#2c6ab0,#235a98);color:#fff;font-weight:600;letter-spacing:.08em;font-size:13px}
  .big.alt{background:#14263e;border:1px solid #2a4468;color:#cfe3ff}.big:disabled{opacity:.4}.big:active{transform:translateY(1px)}
  .lnk{all:unset;cursor:pointer;color:var(--dim);font-size:12px;padding:6px}
  .scr label{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .scr input{background:#0c1626;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font:15px -apple-system,system-ui,sans-serif;outline:none;text-transform:none;letter-spacing:0}
  .codein{text-align:center;font:600 28px ui-monospace,Menlo,monospace!important;letter-spacing:.35em!important;text-transform:uppercase!important}
  .codebig{font:700 38px ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--gold);padding:12px 0 12px .3em;border:1px solid var(--line);border-radius:14px;background:#0c1626}
  .err{min-height:16px;color:#f0937a;font-size:12px}.ap{display:flex;flex-direction:column;gap:8px;align-items:center}
  canvas.pv{width:84px;height:84px;image-rendering:pixelated;border-radius:14px;border:1px solid var(--line)}
  .sw{display:flex;gap:6px}.sw button{all:unset;width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer;box-sizing:border-box}.sw button.sel{border-color:#fff}.sw .none{border:2px dashed #3a5070}.sw .none.sel{border-color:#fff}
  .pvt{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0c1626}.mem{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;font-size:12px}.mem canvas{width:34px;height:34px;image-rendering:pixelated;border-radius:8px}
  #feedbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 14px;background:rgba(10,18,32,.92);border:1px solid #2a4468;border-radius:14px;font-size:13px;transform:translateY(140%);transition:transform .3s;pointer-events:none;backdrop-filter:blur(10px)}
  #feedbar.on{transform:none;pointer-events:auto}#feedbar b{color:var(--gold);font-weight:600}
  #feedbar button{all:unset;cursor:pointer;background:#2c6ab0;color:#fff;font-weight:600;font-size:12px;padding:7px 14px;border-radius:9px;letter-spacing:.06em}
</style></head><body><div id="app">
<header><div><h1>OUR TANK</h1><div class="pill"><span id="day">DAY 001</span> · <span id="todl">Afternoon</span> · <span id="shells">🐚 0</span><span id="conn">· reconnecting…</span></div></div>
<div class="avs" id="avs"></div></header>
<main><canvas id="tank"></canvas>
<canvas id="glass"></canvas><div id="feedbar"><span>🫙 Tap the water to drop food · <b id="feedleft"></b></span><button id="feeddone">Done</button></div><div id="card"></div><div id="sheet"></div><div id="toast"></div>
<div class="tod"><button data-tod="morning">Morning</button><button data-tod="afternoon" class="on">Afternoon</button><button data-tod="evening">Evening</button><button data-tod="night">Night</button></div></main>
<nav><div data-tab="tank" class="on"><svg viewBox="0 0 24 24"><path d="M3 12c4-6 11-6 15 0-4 6-11 6-15 0zM18 12l3-3v6z"/></svg>Tank</div>
<div data-tab="care"><svg viewBox="0 0 24 24"><path d="M9 3h6v3l2 3v11H7V9l2-3z"/></svg>Care</div>
<div data-tab="decorate"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v10l-8 4-8-4V7z"/></svg>Decorate</div>
<div data-tab="friends"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>Friends</div>
<div data-tab="journal"><svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 012 2v13H6a2 2 0 01-2-2zM20 5h-7"/></svg>Journal</div></nav></div>
<div id="welcome"></div>
<script type="module" src="src/main3d.js"></script>
</body></html>
