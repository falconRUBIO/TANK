/* small phones (iPhone SE and the like): a card never runs off the screen, it scrolls; a hint sits under the top bar, wide, instead of squeezed beside it */

@media (max-width:379px){#toast{top:calc(env(safe-area-inset-top,0px) + 58px)!important;max-width:calc(100% - 32px)!important}#modal .box{padding:16px;gap:10px}}
/* Feed: its own screen, a card per animal (Design 2) */
#sheet .fhead{position:relative;text-align:center;padding:2px 44px 6px}#sheet .fhead h3{margin:0;font-size:22px;font-weight:600;letter-spacing:0;text-transform:none;color:#f2f7fb}#sheet .fhead p{margin:4px 0 0;font-size:14px;color:rgba(230,240,250,.7)}
#sheet .fhead .fx{all:unset;cursor:pointer;position:absolute;right:4px;top:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(240,246,252,.85);border-radius:50%}
#sheet .fcards{display:flex;flex-direction:column;gap:10px;margin:10px 0}
#sheet .fcard{all:unset;box-sizing:border-box;position:relative;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 12px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);cursor:pointer}
#sheet button.fcard:active{transform:scale(.985)}#sheet .fcard.isfull{opacity:.82}
#sheet .fthumb{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;transform:scale(1.55);transform-origin:center}      
#sheet .fmid{display:flex;flex-direction:column;gap:2px;min-width:0}#sheet .fmid b{font-size:17px;color:#f2f7fb}#sheet .fmid small{font-size:13px;color:rgba(225,235,245,.66)}
#sheet .ffood{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:rgba(235,242,250,.9)}#sheet .ffood img,#sheet .ffood svg{width:22px;height:22px}
#sheet .fpill{position:absolute;top:12px;right:12px;font-style:normal;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px}
#sheet .fpill.full{background:rgba(52,140,80,.75);color:#e3ffea}#sheet .fpill.ok{background:rgba(160,120,30,.75);color:#fff1c4}#sheet .fpill.hungry{background:rgba(190,80,40,.8);color:#ffe6da}
#sheet .fcard .chev{position:absolute;right:16px;top:58%;font-style:normal;font-size:22px;color:rgba(235,242,250,.6)}
#sheet .fcard .fby{grid-column:1/-1;font-size:12px;color:rgba(225,235,245,.55)}
#sheet .fcard.fish{display:block;cursor:default}#sheet .fcard .ftop{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px}
#sheet .ftiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#sheet .ftile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px 10px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);cursor:pointer;text-align:center}
#sheet .ftile:active{transform:scale(.97)}#sheet .ftile[disabled]{opacity:.45;cursor:default}#sheet .ftile b{font-size:14px;color:#f2f7fb}#sheet .ftile small{font-size:12px;color:rgba(225,235,245,.7)}#sheet .ftile .ffav{position:absolute;top:6px;right:8px;font-style:normal;font-size:11px;color:#ff9fb0}
#sheet .finfo{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
#sheet .finfo i{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(235,242,250,.85);color:#1b2a3a;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}#sheet .finfo p{margin:0;font-size:14px;color:rgba(235,242,250,.85)}
#sheet .crow.hot{border:1px solid rgba(240,200,90,.75);background:linear-gradient(90deg,rgba(240,200,90,.16),rgba(240,200,90,.05))}
#sheet .fcard.hungry{border-color:rgba(240,150,90,.6);box-shadow:0 0 0 1px rgba(240,150,90,.25) inset}
#sheet .fcard .chev{top:62px!important}#sheet .ftiles.rest .ftile{opacity:.5}#sheet .ftile.poor{opacity:.45}
#sheet .finfo2{grid-column:1/-1;margin-top:6px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px;text-align:left}
#sheet .finfo2 p{margin:0;font-size:13px;color:rgba(230,240,250,.8)}#sheet .finfo2 b{color:#f2f7fb}#sheet .finfo2 .fwhy{color:rgba(230,240,250,.58);font-size:12px}
#sheet .finfo2 .fh{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}#sheet .finfo2 .fh i{display:block;height:100%;border-radius:3px;background:#56c98a}#sheet .finfo2 .fh.ok i{background:#e7b84a}#sheet .finfo2 .fh.hungry i{background:#f08a5a}
/* Feed screen, closer to Design 2: taller sheet, bigger pictures, names and pills, the fish tiles beside the picture */
#sheet.feedv{height:min(78vh,calc(100vh - var(--top) - var(--bar) - 30px))!important}
#sheet .fcard{grid-template-columns:76px 1fr auto;padding:14px 16px 14px 12px}#sheet .fthumb{width:76px;height:76px;transform:scale(1.6)}
#sheet .fmid b{font-size:19px;font-weight:600}#sheet .fmid small{font-size:14px}#sheet .ffood{font-size:15px}
#sheet .fpill{font-size:14px;padding:5px 14px;top:14px;right:14px}#sheet .fpill.full{background:#2f8a4e;color:#fff}#sheet .fpill.ok{background:#a37c22;color:#fff}#sheet .fpill.hungry{background:#c4552c;color:#fff}
#sheet .fcard .ftop{grid-template-columns:76px 1fr}#sheet .fcard.fish .ftiles{margin:6px 0 0 88px}#sheet .ftile{padding:10px 4px 8px}
@media (max-width:379px){#sheet .fcard.fish .ftiles{margin-left:0}}
/* Feed: an animal that wants to eat has an obvious Feed button; a full one has none */
#sheet .fgo{position:absolute;right:14px;bottom:14px;padding:8px 20px;border-radius:999px;font-weight:700;font-size:15px;color:#2a1c00;background:linear-gradient(180deg,#ffd76a,#f0b43a);box-shadow:0 4px 12px -4px rgba(240,180,58,.7),inset 0 1px 0 rgba(255,255,255,.6)}
#sheet .fgo.poor{background:rgba(255,255,255,.18);color:rgba(240,246,252,.7);box-shadow:none}
#sheet .ftiles[hidden]{display:none}#sheet .fcard.fish:not(.isfull) .ftile{border-color:rgba(240,190,80,.55);background:rgba(240,190,80,.12)}
#sheet .fnext{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:calc(100% - 88px);margin:4px 0 0 88px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:14px;color:rgba(230,240,250,.78)}
#sheet .fnext i{font-style:normal;font-size:18px;color:rgba(235,242,250,.6)}
@media (max-width:379px){#sheet .fnext{width:100%;margin-left:0}}
/* Feed: the status is a label, not a button (a colored dot and word); the Feed button is the only button */
#sheet .fpill{background:none!important;box-shadow:none!important;padding:0!important;font-size:13px!important;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:6px;top:16px!important;right:16px!important}
#sheet .fpill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
#sheet .fpill.full{color:#6fd99a!important}#sheet .fpill.ok{color:#f0c35a!important}#sheet .fpill.hungry{color:#ff9a6b!important}
#sheet .fgo{bottom:auto!important;top:50%;transform:translateY(-10%)}
#sheet .fnext{background:none!important;padding:6px 2px!important;font-size:13.5px!important}
/* Care: a chore that is due looks like Feed (gold row, one gold button); one that is not has no button */
#sheet .crow.due{border:1px solid rgba(240,200,90,.75)!important;background:linear-gradient(90deg,rgba(240,200,90,.16),rgba(240,200,90,.05))!important;border-radius:16px}
#sheet .crow .cbtn{all:unset;cursor:pointer;flex:none;padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;color:#2a1c00;background:linear-gradient(180deg,#ffd76a,#f0b43a);box-shadow:0 4px 12px -4px rgba(240,180,58,.7),inset 0 1px 0 rgba(255,255,255,.6)}
#sheet .playsoon2{margin:8px 4px 0;font-size:13px;color:rgba(230,240,250,.6)}
#sheet .ftile small{white-space:nowrap;font-size:11.5px}

/* Crew, redone: each caretaker on a card of their own, a glowing ring when they are here, when they were last here otherwise */
#sheet .crew .crewbox{background:none;overflow:visible}
#sheet .crew .crewbox .slots{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;padding:0!important;background:none!important}
#sheet .crew .slot{display:flex;flex-direction:column;align-items:center;padding:14px 6px 12px!important;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.12)!important}
#sheet .crew .slot.me{background:linear-gradient(180deg,rgba(255,214,120,.16),rgba(255,255,255,.04))!important}
#sheet .crew .slot.empty{background:none!important;box-shadow:inset 0 0 0 1.5px rgba(142,195,255,.28)!important;cursor:pointer}
#sheet .crew .avw{width:64px;height:64px;margin-bottom:6px}#sheet .crew .avw canvas{width:58px!important;height:58px!important}
#sheet .crew .avw.live{box-shadow:0 0 0 2.5px #4fe08a,0 0 16px rgba(79,224,138,.55)}#sheet .crew .avw.live::after{display:none}
#sheet .crew .slot b{font:650 14px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:5px;justify-content:center}
#sheet .crew .slot b .youb{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:8px;background:rgba(255,214,120,.25);color:#ffe2a0}
#sheet .crew .slot small{font-size:11px;margin:2px 0 8px;text-align:center;line-height:1.25;opacity:.85}#sheet .crew .slot small.here{color:#7df0a8;opacity:1;font-weight:600}
#sheet .crew .slot small.here::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#4fe08a;margin-right:5px;vertical-align:1px;box-shadow:0 0 6px #4fe08a}
#sheet .crew .slot .nudge{height:30px;min-width:34px;border-radius:15px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
#sheet .crew .pcmini{margin-top:10px;border-radius:18px!important;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.04))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

/* Today: what the page is, tappable mood and level, and the detail card */
#sheet .todaysub{margin:-6px 4px 12px;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.4}
#sheet .tline button{all:unset;min-width:0;box-sizing:border-box;cursor:pointer}#sheet .tline .lvl{display:flex;align-items:center;gap:8px;font-size:12px}
#modal .box.info{text-align:left}#modal .box.info button{text-align:center;justify-content:center}#modal .box.info h2{text-align:center}#modal .box.info .big-ic{text-align:center}
#modal .box.info .ipic{margin:-6px auto 12px;width:120px;height:120px;border-radius:28px;background:radial-gradient(circle at 50% 35%,rgba(140,220,255,.35),rgba(20,70,110,.5));display:grid;place-items:center}
#modal .box.info .ipic img{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}
#modal .box.info .isub{text-align:center;margin:-4px 0 12px;color:var(--dim);font-size:13px}
#modal .box.info .ifacts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);font-size:13.5px}
#modal .box.info .ifacts dt{color:var(--dim)}#modal .box.info .ifacts dd{margin:0;font-weight:600}
#modal .box.info .ibody{font-size:13.5px;line-height:1.45;margin:0 0 14px}#modal .box.info #mno{display:block;margin:10px auto 0}

/* Care in Liquid Glass: each job its own glass pane over the tank, the icon in a glass bubble, what is due glowing gold; the same title and tabs as Today and Crew */
#sheet .care2 .seg{margin-bottom:8px}
#sheet .care2 h4{margin:16px 4px 8px;font:700 12px -apple-system,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(235,242,250,.6)}
#sheet .care2 .cgroup{display:flex;flex-direction:column;gap:8px;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;overflow:visible!important}
#sheet .care2 .crow{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px!important;border-radius:22px!important;border:1px solid rgba(255,255,255,.16)!important;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 60%,rgba(255,255,255,.08))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.14)!important;overflow:hidden}
#sheet .care2 .crow::before{content:'';position:absolute;inset:0 0 55% 0;border-radius:22px 22px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0));pointer-events:none}
#sheet .care2 .crow.due,#sheet .care2 .crow.hot{border-color:rgba(255,214,120,.55)!important;background:linear-gradient(135deg,rgba(255,214,120,.24),rgba(255,255,255,.06) 65%)!important;box-shadow:inset 0 1px 0 rgba(255,240,200,.35),0 0 0 1px rgba(255,214,120,.12),0 10px 28px rgba(240,180,60,.16)!important}
#sheet .care2 .crow .ci{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.08) 60%,rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.12)}
#sheet .care2 .crow .ct b{font:650 16px -apple-system,system-ui,sans-serif;color:#fff}#sheet .care2 .crow .ct small{font-size:12.5px;color:rgba(235,242,250,.72)}
#sheet .care2 .crow .chev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-style:normal;color:rgba(255,255,255,.8)}
#sheet .care2 .crow .cbtn{background:linear-gradient(180deg,#ffe08a,#f0b23e)!important;color:#3b2504!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(240,170,40,.35)}
#sheet .care2 .soon{border-radius:22px!important;border:1px solid rgba(255,255,255,.14)!important;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04))!important;-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)!important;margin-top:12px}
#sheet .care2 .soon h5{font:700 12px -apple-system,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(235,242,250,.6)}

/* the grab handle at the top of every sheet: frosted glass, not a dark slab */
#sheet .x{background:linear-gradient(180deg,rgba(40,70,100,.42),rgba(40,70,100,.0))!important;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:none!important}

/* ── one look for every sheet (Apple-like): a plain bold title that says what the sheet is, a short line under it, the same section labels,
   the same segmented control, and every row or tile a pane of frosted glass ── */
#sheet .crew>h3{font:700 22px -apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif!important;letter-spacing:-.02em!important;text-transform:none!important;color:#fff!important;text-align:center;margin:6px 0 2px!important;text-shadow:none!important}
#sheet .crew .crewsub,#sheet .todaysub{font:400 13px -apple-system,system-ui,sans-serif!important;color:rgba(235,242,250,.66)!important;text-align:center;margin:2px 8px 14px!important;line-height:1.4}
#sheet .crew .seg{margin:4px 0 14px!important}
#sheet .crew h4,#sheet .crew h4.ntsh,#sheet .care2 h4{font:600 12.5px -apple-system,system-ui,sans-serif!important;letter-spacing:.05em!important;text-transform:uppercase;color:rgba(235,242,250,.58)!important;margin:20px 6px 8px!important}
#sheet .crew .nowl,#sheet .crew .anl{gap:8px!important}
#sheet .crew .nowr,#sheet .crew .anr,#sheet .crew .gcard,#sheet .crew .pcmini,#sheet .crew .tile,#sheet .crew .soon,#sheet .crew .awayl p,#sheet .shop2 .card,#sheet .crew .fg,#sheet .crew .shown>div,#sheet .crew .toybox>*{border-radius:20px!important;border:1px solid rgba(255,255,255,.16)!important;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 60%,rgba(255,255,255,.08))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12)!important}
#sheet .crew .nowr .nowb{background:none!important;border:0!important;box-shadow:none!important}
#sheet .crew .gcard{border-color:rgba(255,214,120,.45)!important;background:linear-gradient(135deg,rgba(255,214,120,.2),rgba(255,255,255,.05) 65%)!important}
#sheet .shop2 .cat{border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 60%,rgba(255,255,255,.08))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12)!important}#sheet .shop2 .cat.on{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.22))!important;color:#fff!important}
#sheet .crew p.calm{padding:14px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.16)!important;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 60%,rgba(255,255,255,.08))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12)!important;margin:0}
#sheet .crew .tline{padding:12px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.16)!important;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 60%,rgba(255,255,255,.08))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12)!important;margin:0 0 4px!important}

#sheet .crew .jday h5{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;position:static!important;background:none!important;box-shadow:none!important;border:0!important;padding:0!important;margin:18px 6px 8px!important;font:600 12.5px -apple-system,system-ui,sans-serif!important;letter-spacing:.05em;text-transform:uppercase;color:rgba(235,242,250,.58)!important}
#sheet .crew .histlnk{display:inline;padding:0 0 0 4px;font-size:13px;color:#9fd3ff;background:none!important;border:0!important}
#sheet .crew .je,#sheet .crew .jl>div{border-radius:20px!important}

/* ── Today's top row: two labelled glass tiles, so "mood" and "level" read as what they are ── */
#sheet .crew .tline{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px!important;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#sheet .crew .tline button{all:unset;min-width:0;box-sizing:border-box;cursor:pointer;display:flex!important;flex-direction:column;align-items:flex-start!important;text-align:left;gap:3px!important;padding:11px 14px!important;font-size:inherit!important;color:#fff!important;border-radius:20px!important;border:1px solid rgba(255,255,255,.16)!important;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04))!important;-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
#sheet .crew .tline button>small{font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:rgba(235,242,250,.6)}
#sheet .crew .tline button>b{font:650 15.5px -apple-system,system-ui,sans-serif;color:#fff}
#sheet .crew .tline .lvl i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin:3px 0 1px}#sheet .crew .tline .lvl i b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7fe0ff,#b9f3ff)}
#sheet .crew .tline .lvl small:last-child{font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:500;color:rgba(235,242,250,.65)}
#sheet .crew .tline .mood.good b,#sheet .crew .tline .mood.great b{color:#a8f0c0}#sheet .crew .tline .mood.bad b,#sheet .crew .tline .mood.low b{color:#ffcf8a}
#sheet .cat{text-transform:none!important;letter-spacing:0!important;white-space:nowrap}

/* ── every pop-up reads like an iOS alert: a sentence-case title, calm body text, a full-width main button and a quiet second choice ── */
#modal .box h2{font:700 19px/1.25 -apple-system,system-ui,sans-serif!important;letter-spacing:-.01em!important;text-transform:none!important;color:#fff}
